name: Native app checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 fonts-dejavu-core desktop-file-utils
      - run: python -m pip install . build
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - run: desktop-file-validate packaging/io.github.tcballard.omarchy-solitaire.desktop
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git python python-build python-installer python-setuptools python-wheel pyside6 qt6-declarative qt6-svg qt6-wayland ttf-dejavu
      - uses: actions/checkout@v4
      - run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg --noconfirm"
      - name: Install and launch the built package
        run: |
          pacman -U --noconfirm ./*.pkg.tar.zst
          su builder -c 'cd /tmp && QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software omarchy-solitaire --state-dir /tmp/solitaire-package-test --screenshot /tmp/solitaire-package.png'
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: '*.pkg.tar.zst'
