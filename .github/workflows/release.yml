name: Package release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git rust libglvnd libx11 libxcursor libxi libxrandr libxkbcommon libxkbcommon-x11 wayland dbus mesa xorg-server-xvfb xorg-xauth python
      - uses: actions/checkout@v4
      - name: Verify version agrees with tag and package
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          test "$GITHUB_REF_NAME" = "v$version"
          . ./PKGBUILD
          test "$pkgver" = "$version"
      - run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg --noconfirm"
          pacman -U --noconfirm ./*.pkg.tar.zst
          su builder -c 'cd /tmp && xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 omarchy-solitaire --state-dir /tmp/solitaire-package-test --screenshot /tmp/solitaire-package.png'
          test -s /tmp/solitaire-package.png
          sha256sum *.pkg.tar.zst > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            *.pkg.tar.zst
            SHA256SUMS
          body: |
            Native Rust Klondike for Omarchy. Download the Arch package and run:
            `sudo pacman -U ./omarchy-solitaire-*.pkg.tar.zst`

            Includes original court illustrations, animated deals and moves,
            compatible Python save migration, themed official Omarchy card backs,
            custom SVG/PNG artwork, draw-one/draw-three, undo, hints and resume.

            Real Omarchy desktop acceptance is required before promoting this draft.
