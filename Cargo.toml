[package]
name = "omarchy-solitaire"
version = "0.2.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
description = "Native retro Klondike for Omarchy"
repository = "https://github.com/tcballard/omarchy-solitaire"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui_extras = { version = "=0.31.1", default-features = false, features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
fs2 = "0.4"
tempfile = "3"
rand = "0.8"
roxmltree = "0.19"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[profile.release]
strip = true
